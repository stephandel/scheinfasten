<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilz Handel ist umgezogen</title>
<link rel="canonical" href="https://stephandel.github.io/heilpilze/pilzhandel/">
<meta http-equiv="refresh" content="0; url=https://stephandel.github.io/heilpilze/pilzhandel/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#F7F1E8;color:#3A2A1F;text-align:center}a{color:#7a5a2f}</style>
<div>
  <p><strong>Pilz Handel</strong> hat eine neue Adresse.</p>
  <p><a id="ziel" href="https://stephandel.github.io/heilpilze/pilzhandel/">stephandel.github.io/heilpilze/pilzhandel/</a></p>
  <p style="opacity:.7;font-size:.9rem">Du wirst automatisch weitergeleitet.</p>
</div>
<script>
  // Den alten Service Worker abmelden, sonst liefert eine installierte Kopie
  // weiterhin die zwischengespeicherte alte Fassung aus.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
  }
  var ziel = 'https://stephandel.github.io/heilpilze/pilzhandel/' + (location.hash || '');
  document.getElementById('ziel').href = ziel;
  location.replace(ziel);
</script>
